services:
  - type: web
    name: hirelens-app
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: STORAGE
        value: local
      - key: SERVE_CLIENT
        value: "true"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: VITE_DEMO_MODE
        value: "true"
